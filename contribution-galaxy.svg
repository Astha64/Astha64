<svg width="100%" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1b1140"/>
      <stop offset="55%" stop-color="#0d0821"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- nebula core -->
  <ellipse cx="450" cy="130" rx="260" ry="110" fill="url(#core)">
    <animate attributeName="rx" values="260;280;260" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- title -->
  <text x="450" y="40" text-anchor="middle" font-family="Fira Code, monospace" font-size="22" fill="#e9d5ff" font-weight="bold">
    🌌 Contribution Galaxy
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#a78bfa">
    every commit, a star
  </text>

  <!-- scattered stars, twinkling -->
  <g fill="#ffffff">
    <circle cx="60" cy="50" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="180" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="90" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="210" r="2" fill="url(#star-glow)"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="60" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="200" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="220" r="1.7"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="75" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="195" r="2.1" fill="url(#star-glow)"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="55" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="190" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="80" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="200" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="140" r="1.2"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="130" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="30" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="30" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="30" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="150" r="1.2"><animate attributeName="opacity" values="1;0.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="150" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting shooting star -->
  <g>
    <line x1="0" y1="0" x2="40" y2="20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.85;0.92;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-50,20; 950,150" keyTimes="0;1" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="450" y="245" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#7c3aed">
    ✦ powered by every push, pull request, and late-night commit ✦
  </text>
</svg>
